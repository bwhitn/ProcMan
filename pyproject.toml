[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "procman"
version = "0.1.0"
description = "Process supervision helpers with per-job memory and time limits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "bwhitn" }
]
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "twine>=7,<8",
]

[project.urls]
Homepage = "https://github.com/bwhitn/ProcMan"
Source = "https://github.com/bwhitn/ProcMan"

[tool.hatch.build.targets.wheel]
packages = ["src/procman"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
